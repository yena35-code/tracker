<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘 올라옴?</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0D1321" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="오늘 올라옴?" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root {
    --bg: #0D1321; --card: #131A2C; --card2: #0F1526; --line: #222B45;
    --text: #EFEDE6; --muted: #8B93A7; --dim: #5A6278; --amber: #FFB020;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans KR', sans-serif; min-height: 100vh; }
  .display { font-family: 'Do Hyeon', sans-serif; }
  header { padding: 24px 20px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; }
  h1 { font-family: 'Do Hyeon', sans-serif; font-size: 2rem; line-height: 1; font-weight: 400; }
  h1 .amber { color: var(--amber); }
  .sub { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .btns { display: flex; gap: 8px; }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 8px; font-weight: 700; }
  .btn-ghost { background: #161D2F; border: 1px solid #2A3350; color: var(--muted); padding: 8px 12px; font-size: 12px; }
  .btn-amber { background: var(--amber); color: var(--bg); padding: 8px 12px; font-size: 12px; }
  main { padding: 16px 20px; max-width: 720px; margin: 0 auto; }
  .empty { text-align: center; padding: 64px 0; font-size: 14px; color: var(--muted); line-height: 1.8; }
  .empty b { color: var(--amber); }
  .row { display: flex; align-items: stretch; gap: 16px; border-radius: 12px; margin-bottom: 12px; overflow: hidden; background: var(--card); border: 1px solid var(--line); }
  .row.today { background: #1E1A0E; border-color: var(--amber); }
  .dday { min-width: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; background: var(--card2); }
  .row.today .dday { background: var(--amber); }
  .dday .big { font-family: 'Do Hyeon', sans-serif; font-size: 1.6rem; }
  .row.today .dday .big, .row.today .dday .date { color: var(--bg); }
  .dday .date { font-size: 11px; margin-top: 4px; font-weight: 700; color: var(--muted); }
  .info { flex: 1; padding: 12px 8px 12px 0; display: flex; flex-direction: column; justify-content: center; }
  .name { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .ep { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .chip { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 4px; background: var(--bg); }
  .none { font-size: 11px; color: var(--dim); }
  .del { background: none; color: var(--dim); padding: 0 12px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); animation: pulseDot 1.6s ease-in-out infinite; }
  @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:.25} }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  .dayhead { display: flex; align-items: baseline; gap: 8px; margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .dayhead .dayname { font-family: 'Do Hyeon', sans-serif; font-size: 1.3rem; }
  .dayhead.today .dayname { color: var(--amber); }
  .dayhead .daydate { font-size: 12px; color: var(--muted); font-weight: 700; }
  .daytag { font-size: 10px; font-weight: 700; background: var(--amber); color: var(--bg); border-radius: 4px; padding: 2px 6px; }
  .dayempty { color: var(--dim); font-size: 12px; padding: 2px 0 2px 2px; }
  .show { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .show.today { background: #1E1A0E; border-color: var(--amber); }
  .show.dimmed { opacity: .55; }
  .show-info { flex: 1; }
  .show .name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .epn { font-size: 12px; color: var(--muted); font-weight: 400; }
  .show.done { opacity: .45; }
  .chk { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; min-width: 30px; height: 30px; font-size: 13px; padding: 0; }
  .chk.on { background: var(--amber); border-color: var(--amber); color: var(--bg); }
  .overlay { position: fixed; inset: 0; background: rgba(13,19,33,0.97); z-index: 50; display: none; flex-direction: column; padding: 20px; }
  .overlay.open { display: flex; }
  .searchbar { display: flex; gap: 8px; max-width: 720px; margin: 0 auto; width: 100%; }
  input { flex: 1; border-radius: 8px; padding: 12px 16px; font-size: 14px; font-family: inherit; background: #161D2F; border: 1px solid #2A3350; color: var(--text); outline: none; }
  .results { margin-top: 16px; overflow-y: auto; max-width: 720px; margin-left: auto; margin-right: auto; width: 100%; }
  .pick { width: 100%; display: flex; align-items: center; gap: 12px; border-radius: 12px; padding: 12px; margin-bottom: 8px; text-align: left; background: var(--card); border: 1px solid var(--line); color: var(--text); font-weight: 400; }
  .pick:disabled { opacity: 0.45; cursor: default; }
  .pick img, .pick .noimg { width: 44px; height: 66px; border-radius: 4px; object-fit: cover; background: var(--card2); flex-shrink: 0; }
  .pick .meta { flex: 1; }
  .pick .t { font-weight: 700; font-size: 14px; }
  .pick .y { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .pchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .pchip { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--bg); }
  .pick .added { font-size: 11px; font-weight: 700; color: var(--amber); }
  .label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 8px 0; }
  .err { max-width: 720px; margin: 12px auto 0; padding: 8px 16px; border-radius: 8px; background: #2B1620; color: #FF6B81; font-size: 12px; display: none; }
  .err.show { display: block; }
  .loading { text-align: center; font-size: 12px; color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>

<header>
  <div>
    <h1>오늘 <span class="amber">올라옴?</span></h1>
    <div class="sub" id="subline">오늘 예정된 업로드 없음</div>
  </div>
  <div class="btns">
    <button class="btn-ghost" id="refreshBtn">새로고침</button>
    <button class="btn-amber" id="addBtn">+ 추가</button>
  </div>
</header>

<div class="err" id="errBox"></div>
<main id="list"></main>

<div class="overlay" id="overlay">
  <div class="searchbar">
    <input id="q" placeholder="프로그램 이름 검색 (예: 환승연애)" />
    <button class="btn-amber" id="searchBtn">검색</button>
    <button class="btn-ghost" id="closeBtn">닫기</button>
  </div>
  <div class="results" id="results"></div>
</div>

<script>
const API_KEY = "61e06244f92a8f972370616edf8345e5";
const IMG = "https://image.tmdb.org/t/p/w185";

const PLATFORMS = [
  { key: "tving", label: "티빙", color: "#FF153C", match: ["tving"], timeHint: "본방 종료 직후" },
  { key: "wavve", label: "웨이브", color: "#2E6BFF", match: ["wavve"], timeHint: "본방 종료 직후" },
  { key: "netflix", label: "넷플릭스", color: "#E50914", match: ["netflix"], timeHint: "오후 4~5시 (글로벌 동시)" },
  { key: "disney", label: "디즈니+", color: "#4FC3F7", match: ["disney"], timeHint: "오후 4시 전후" },
  { key: "coupang", label: "쿠팡플레이", color: "#F5A623", match: ["coupang"], timeHint: "공개일 오전" },
];

let shows = [];
let browseList = [];
let watched = new Set();
try { watched = new Set(JSON.parse(localStorage.getItem("ott-watched") || "[]")); } catch (e) {}
const saveWatched = () => { try { localStorage.setItem("ott-watched", JSON.stringify([...watched])); } catch (e) {} };
try { shows = JSON.parse(localStorage.getItem("ott-shows") || "[]"); } catch (e) { shows = []; }
const save = () => { try { localStorage.setItem("ott-shows", JSON.stringify(shows)); } catch (e) {} };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const tmdb = async (path, params = "") => {
  const res = await fetch(`https://api.themoviedb.org/3${path}?api_key=${API_KEY}&language=ko-KR${params}`);
  if (!res.ok) throw new Error("TMDB " + res.status);
  return res.json();
};

const showErr = (msg) => { const b = $("errBox"); b.textContent = msg; b.classList.add("show"); setTimeout(() => b.classList.remove("show"), 4000); };

const kstToday = () => { const n = new Date(Date.now() + 9*3600*1000); return Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()); };
const ddayOf = (ds) => { if (!ds) return null; const [y,m,d] = ds.split("-").map(Number); return Math.round((Date.UTC(y,m-1,d) - kstToday()) / 86400000); };
const fmtDate = (ds) => { if (!ds) return "미정"; const [y,m,d] = ds.split("-").map(Number); const w = ["일","월","화","수","목","금","토"][new Date(Date.UTC(y,m-1,d)).getUTCDay()]; return `${m}/${d} (${w})`; };

const matchPlatforms = (list) => {
  if (!list) return [];
  const names = list.map((p) => (p.provider_name || "").toLowerCase());
  return PLATFORMS.filter((pl) => names.some((n) => pl.match.some((m) => n.includes(m))));
};

const ymd = (offsetDays) => new Date(kstToday() + offsetDays * 86400000).toISOString().slice(0, 10);

// 리스트 항목마다 시청 가능한 OTT 조회해서 붙이기
const attachProviders = (list) => Promise.all(list.map(async (r) => {
  try {
    const d = await tmdb(`/tv/${r.id}/watch/providers`);
    const kr = d.results?.KR;
    r.provs = matchPlatforms([...(kr?.flatrate || []), ...(kr?.ads || [])]);
  } catch (e) { r.provs = []; }
  return r;
}));

const fetchShow = async (id) => {
  const d = await tmdb(`/tv/${id}`, "&append_to_response=watch/providers");
  const kr = d["watch/providers"]?.results?.KR;
  // 시즌 전체 회차를 조회해 이번 주 여러 회차(금토 드라마 등)를 모두 잡음
  let upcoming = [];
  const seasonNum = (d.next_episode_to_air || d.last_episode_to_air || {}).season_number;
  if (seasonNum) {
    try {
      const season = await tmdb(`/tv/${id}/season/${seasonNum}`);
      upcoming = (season.episodes || [])
        .filter((e) => e.air_date && ddayOf(e.air_date) >= 0)
        .map((e) => ({ season_number: e.season_number, episode_number: e.episode_number, air_date: e.air_date }))
        .slice(0, 6);
    } catch (e) {}
  }
  return {
    id: d.id, name: d.name, status: d.status,
    nextEp: d.next_episode_to_air || null,
    lastEp: d.last_episode_to_air || null,
    upcoming,
    providers: matchPlatforms([...(kr?.flatrate || []), ...(kr?.ads || [])]),
  };
};

const DAYN = ["일","월","화","수","목","금","토"];

// 다음 회차 정보가 없으면 마지막 회차 +7일로 예상
const predictEp = (s) => {
  if (s.nextEp || !s.lastEp || !s.lastEp.air_date) return null;
  const lastDd = ddayOf(s.lastEp.air_date);
  if (lastDd < -21) return null; // 3주 넘게 소식 없으면 예측 안 함
  let dd = lastDd + 7;
  let epNum = s.lastEp.episode_number + 1;
  while (dd < 0) { dd += 7; epNum += 1; }
  const date = new Date(kstToday() + dd * 86400000);
  return { season_number: s.lastEp.season_number, episode_number: epNum, air_date: date.toISOString().slice(0, 10), predicted: true };
};

const showCard = (s, ep, isToday) => {
  const chips = s.providers.length > 0
    ? s.providers.map((p) => `<span class="chip" style="color:${p.color};border:1px solid ${p.color}">${p.label} · ${p.timeHint}</span>`).join("")
    : `<span class="none">5개 플랫폼 미제공 (정보 없음)</span>`;
  const key = ep ? `${s.id}-s${ep.season_number}e${ep.episode_number}` : "";
  const done = key && watched.has(key);
  return `
    <div class="show ${isToday ? "today" : ""} ${done ? "done" : ""}">
      <div class="show-info">
        <div class="name">${isToday && !done ? '<span class="dot"></span>' : ""}${esc(s.name)}${ep ? `<span class="epn">${ep.season_number}시즌 ${ep.episode_number}화${ep.predicted ? " (예상)" : ""}</span>` : ""}</div>
        <div class="chips">${chips}</div>
      </div>
      ${key ? `<button class="chk ${done ? "on" : ""}" onclick="toggleWatched('${key}')" title="봤어요">✓</button>` : ""}
      <button class="del" onclick="removeShow(${s.id})">✕</button>
    </div>`;
};

const render = () => {
  const byDay = Array.from({ length: 7 }, () => []);
  const later = [], rest = [];
  shows.forEach((s) => {
    const ended = s.status === "Ended" || s.status === "Canceled";
    let eps = !ended && s.upcoming && s.upcoming.length ? s.upcoming : [];
    if (!eps.length && !ended && s.nextEp) eps = [s.nextEp];
    if (!eps.length && !ended) { const p = predictEp(s); if (p) eps = [p]; }
    const thisWeek = eps.filter((e) => { const dd = ddayOf(e.air_date); return dd >= 0 && dd <= 6; });
    if (thisWeek.length) thisWeek.forEach((e) => byDay[ddayOf(e.air_date)].push({ s, ep: e }));
    else if (eps.length) later.push({ s, ep: eps[0] });
    else rest.push({ ...s, ended });
  });
  later.sort((a, b) => ddayOf(a.ep.air_date) - ddayOf(b.ep.air_date));

  const todayCount = byDay[0].length;
  $("subline").textContent = todayCount > 0 ? `오늘 올라오는 프로그램 ${todayCount}개` : "오늘 예정된 업로드 없음";

  if (shows.length === 0) {
    $("list").innerHTML = `<div class="empty">아직 등록된 프로그램이 없어.<br>오른쪽 위 <b>+ 추가</b>로 보고 있는 프로그램을 등록해줘.</div>`;
    return;
  }

  let html = "";
  for (let d = 0; d < 7; d++) {
    const date = new Date(kstToday() + d * 86400000);
    const isToday = d === 0;
    html += `
      <div class="dayhead ${isToday ? "today" : ""}">
        <span class="dayname">${DAYN[date.getUTCDay()]}</span>
        <span class="daydate">${date.getUTCMonth() + 1}/${date.getUTCDate()}</span>
        ${isToday ? '<span class="daytag">오늘</span>' : ""}
      </div>`;
    html += byDay[d].length
      ? byDay[d].map(({ s, ep }) => showCard(s, ep, isToday)).join("")
      : `<div class="dayempty">—</div>`;
  }
  if (later.length) {
    html += `<div class="dayhead"><span class="dayname">다음 주 이후</span></div>`;
    html += later.map(({ s, ep }) => `
      <div class="show">
        <div class="show-info">
          <div class="name">${esc(s.name)}<span class="epn">${ep.season_number}시즌 ${ep.episode_number}화${ep.predicted ? " (예상)" : ""} · ${fmtDate(ep.air_date)} (D-${ddayOf(ep.air_date)})</span></div>
          <div class="chips">${s.providers.map((p) => `<span class="chip" style="color:${p.color};border:1px solid ${p.color}">${p.label}</span>`).join("") || '<span class="none">OTT 정보 없음</span>'}</div>
        </div>
        <button class="del" onclick="removeShow(${s.id})">✕</button>
      </div>`).join("");
  }
  if (rest.length) {
    html += `<div class="dayhead"><span class="dayname">미정 · 완결</span></div>`;
    html += rest.map((s) => `
      <div class="show dimmed">
        <div class="show-info">
          <div class="name">${esc(s.name)}<span class="epn">${s.ended ? "완결" : "다음 회차 미정"}</span></div>
        </div>
        <button class="del" onclick="removeShow(${s.id})">✕</button>
      </div>`).join("");
  }
  $("list").innerHTML = html;
};

const pickRowHtml = (r) => {
  const added = shows.some((s) => s.id === r.id);
  const img = r.poster_path ? `<img src="${IMG + r.poster_path}" alt="">` : `<div class="noimg"></div>`;
  const provChips = (r.provs && r.provs.length)
    ? `<div class="pchips">` + r.provs.map((p) => `<span class="pchip" style="color:${p.color};border:1px solid ${p.color}">${p.label}</span>`).join("") + `</div>`
    : `<div class="pchips"><span class="none">OTT 정보 없음</span></div>`;
  return `
    <button class="pick" ${added ? "disabled" : ""} onclick="addShow(${r.id})">
      ${img}
      <div class="meta">
        <div class="t">${esc(r.name)}</div>
        <div class="y">${r.first_air_date ? r.first_air_date.slice(0,4) : "?"} · ⭐ ${r.vote_average ? r.vote_average.toFixed(1) : "-"}</div>
        ${provChips}
      </div>
      ${added ? '<span class="added">✓ 추가됨</span>' : ""}
    </button>`;
};

const renderResults = (list, label) => {
  $("results").innerHTML = (label ? `<div class="label">${label}</div>` : "") + list.map(pickRowHtml).join("");
};

window.addShow = async (id) => {
  if (shows.some((s) => s.id === id)) return;
  try {
    const s = await fetchShow(id);
    shows.push(s); save(); render();
    // 추가 화면 리스트의 "추가됨" 상태 갱신
    const q = $("q").value.trim();
    if (q && lastResults.length) renderResults(lastResults);
    else renderResults(browseList, "지금 방영중 — 골라서 바로 추가");
  } catch (e) { showErr("프로그램 정보를 불러오지 못했어."); }
};

window.removeShow = (id) => { shows = shows.filter((s) => s.id !== id); save(); render(); };

window.toggleWatched = (key) => {
  if (watched.has(key)) watched.delete(key); else watched.add(key);
  saveWatched(); render();
};

let lastResults = [];
const doSearch = async () => {
  const q = $("q").value.trim();
  if (!q) return;
  $("results").innerHTML = `<div class="loading">검색 중...</div>`;
  try {
    const data = await tmdb("/search/tv", "&query=" + encodeURIComponent(q));
    lastResults = await attachProviders((data.results || []).slice(0, 8));
    renderResults(lastResults);
    if (lastResults.length === 0) $("results").innerHTML = `<div class="loading">검색 결과 없음</div>`;
  } catch (e) { showErr("검색 실패."); }
};

const openAdd = async () => {
  $("overlay").classList.add("open");
  $("q").focus();
  if (browseList.length === 0) {
    $("results").innerHTML = `<div class="loading">불러오는 중...</div>`;
    try {
      const data = await tmdb("/discover/tv", `&with_origin_country=KR&sort_by=popularity.desc&air_date.gte=${ymd(-7)}&air_date.lte=${ymd(7)}`);
      browseList = await attachProviders((data.results || []).slice(0, 20));
    } catch (e) { showErr("인기 리스트를 불러오지 못했어."); }
  }
  renderResults(browseList, "지금 방영중 — 골라서 바로 추가");
};

const refreshAll = async () => {
  if (shows.length === 0) return;
  $("refreshBtn").textContent = "...";
  try {
    shows = await Promise.all(shows.map((s) => fetchShow(s.id)));
    save(); render();
  } catch (e) { showErr("새로고침 중 일부 실패."); }
  $("refreshBtn").textContent = "새로고침";
};

$("addBtn").onclick = openAdd;
$("closeBtn").onclick = () => { $("overlay").classList.remove("open"); $("q").value = ""; lastResults = []; };
$("searchBtn").onclick = doSearch;
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
$("refreshBtn").onclick = refreshAll;

render();
if (shows.length > 0) refreshAll(); // 접속할 때마다 최신 회차 정보로 갱신
</script>
</body>
</html>
